<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>DoInFam</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        touch-action: pan-x pan-y;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      button,
      a,
      [role="button"] {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      img {
        -webkit-user-drag: none;
        user-select: none;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar DoInFam.</noscript>
    <div id="root"></div>
    <script>
      // iOS Safari ignores maximum-scale for pinch gestures in some versions.
      // Keep one-finger scrolling, but cancel multi-touch zoom inside the app.
      const preventGestureZoom = (event) => event.preventDefault();
      document.addEventListener('gesturestart', preventGestureZoom, { passive: false });
      document.addEventListener('gesturechange', preventGestureZoom, { passive: false });
      document.addEventListener('gestureend', preventGestureZoom, { passive: false });
      document.addEventListener(
        'touchmove',
        (event) => {
          if (event.touches.length > 1) event.preventDefault();
        },
        { passive: false }
      );
    </script>
  </body>
</html>
