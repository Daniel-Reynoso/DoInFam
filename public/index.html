<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>DoInFam</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      button,
      a,
      [role="button"] {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      img {
        -webkit-user-drag: none;
        user-select: none;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar DoInFam.</noscript>
    <div id="root"></div>
  </body>
</html>
